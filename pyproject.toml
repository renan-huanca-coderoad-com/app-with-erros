[project]
name = "shopflow"
version = "1.5.0"
description = "NorthStar Supplies - wholesale ordering backend (hackathon target app for the Incident MTTR Triage Agent)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopflow"]
